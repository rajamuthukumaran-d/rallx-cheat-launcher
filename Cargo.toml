[package]
name = "rallx-cheat-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
# raw-window-handle-06 exposes the HWND that dragdrop.rs subclasses; Slint has
# no file-drop event of its own.
slint = { version = "1.8.0", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gilrs = "0.10.6"
global-hotkey = "0.6.0"
# No tray-icon crate: Slint 1.17's built-in SystemTrayIcon element covers it
# and keeps the tray on the same event loop as the window.
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_DataExchange",
    # SHELLEXECUTEINFOW (elevated trainer launch) is gated behind Registry.
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # IShellLinkW/IPersistFile, for reading a .lnk picked as a game.
    "Win32_System_Com",
    "Win32_System_Threading",
    # Process snapshots are used to watch a configured game/app until it exits.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
] }
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.8.0"
winresource = "0.1.31"
