[package]
name = "rallx-cheat-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gilrs = "0.10.6"
global-hotkey = "0.6.0"
tray-icon = "0.19.1"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.8.0"
